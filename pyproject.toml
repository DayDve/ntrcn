[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ntrcn"
version = "0.1.0"
description = "Modern Wayland & KDE Plasma 6 keyboard layout switcher and text fixer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "DayDve", email = "daydve@smbit.pro" }
]
dependencies = [
    "evdev>=1.6.0",
    "dbus-python>=1.2",
    "PySide6>=6.5.0",
]

[project.scripts]
ntrcn = "ntrcn.app:main"

[tool.setuptools.package-data]
# Only what the program needs at run time, plus the attribution the flag license asks for.
ntrcn = [
    "*.desktop",
    "*.rules",
    "icons/*.svg",
    "sounds/*.wav",
    "flags/sprite.svg",
    "flags/README.md",
    "locale/*/LC_MESSAGES/*.mo",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = []
